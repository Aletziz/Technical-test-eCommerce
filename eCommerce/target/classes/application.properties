spring.application.name=eCommerce

# ==============================================
# CONEXIÓN A LA BASE DE DATOS (MySQL)
# ==============================================
# URL de conexión: cambia "nombre_de_tu_bd" por el real
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=clave12345%

# Driver de MySQL (opcional en Spring Boot 2+)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================
# Dialecto para MySQL 8 (si usas versión 5, cambia)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar SQL en consola (modo desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Estrategia DDL: create, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# ==============================================
# CONFIGURACIÓN ADICIONAL DE HIBERNATE
# ==============================================
# Para que use el almacenamiento de datos en InnoDB (importante)
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Batch para inserciones/actualizaciones (mejora rendimiento)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================
# LOGGING (opcional)
# ==============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
